[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bybilay-robotctrl_jd109"
version = "0.1.0"
description = "按段落统计机器人运动控制工程师·批处理调度与吞吐折中相关的长度分布，标出过长、过短与重复表达的部分"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "bybilay" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://bybilay.github.io"
Repository = "https://github.com/bybilay/robotctrl_jd109"
Issues = "https://github.com/bybilay/robotctrl_jd109/issues"

[project.scripts]
robotctrl_jd109 = "robotctrl_jd109:main"

[tool.setuptools]
py-modules = ["robotctrl_jd109"]
